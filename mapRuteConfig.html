<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador d'Itineraris - Santa Tecla 2026</title>
    
    <!-- PWA Manifest i Metadades Mòbils -->
    <link rel="manifest" href="manifest.json?v=1" />
    <meta name="theme-color" content="#c8102e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="img/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="img/icon-192.png" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 420px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .sidebar-header {
            padding: 20px;
            background: #0f172a;
            border-bottom: 1px solid var(--panel-border);
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .stats-badge {
            background: var(--success);
            color: #000;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .filter-box {
            padding: 15px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-filter {
            flex: 1;
            padding: 6px 10px;
            background: #0f172a;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-filter.active, .btn-filter:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .events-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-card {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .event-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .event-card.selected {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.08);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
        }

        .event-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .event-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

        .status-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .status-check.configured {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-check.pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .event-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 12px;
        }

        .event-desc {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-top: 8px;
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 6px;
            line-height: 1.4;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Floating Toolbar over Map */
        .map-toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .tool-btn {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #334155;
        }

        .tool-btn.btn-save {
            background: var(--success);
            color: #000;
            font-weight: 700;
            border: none;
        }

        .tool-btn.btn-save:hover {
            background: #059669;
            color: #fff;
        }

        .tool-btn.btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .tool-btn.btn-clear:hover {
            background: #ef4444;
            color: #fff;
        }

        /* Active Event Banner overlay on top of map */
        .active-event-banner {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 14px 20px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .active-event-banner h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .active-event-banner p {
            font-size: 0.82rem;
            color: #cbd5e1;
            margin-top: 4px;
        }

        /* Custom Leaflet Marker Styling */
        .custom-waypoint-marker {
            background: var(--accent);
            color: #000;
            border: 2px solid #fff;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Waypoints Drawer at bottom of map */
        .waypoints-drawer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            overflow-x: auto;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        .waypoint-chip {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .waypoint-chip span.num {
            background: var(--accent);
            color: #000;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .waypoint-chip .btn-del-wp {
            cursor: pointer;
            color: #ef4444;
            margin-left: 4px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            background: var(--success);
            color: #000;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1><i class="fa-solid fa-map-location-dot"></i> Configurador d'Itineraris</h1>
            <p>Santa Tecla 2026 — Fes clic sobre un acte per editar la seva ruta al mapa.</p>
            <div class="stats-bar">
                <span>Estat global d'itineraris:</span>
                <span class="stats-badge" id="statsBadge">0 / 0</span>
            </div>
        </div>

        <div class="filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cerca per títol o carrer..." oninput="renderEventsList()">
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="setFilter('all', this)">Tots</button>
                <button class="btn-filter" onclick="setFilter('configured', this)">✅ Configurats</button>
                <button class="btn-filter" onclick="setFilter('pending', this)">⏳ Pendents</button>
            </div>
        </div>

        <div class="events-list" id="eventsList">
            <!-- Dynamic events rendering -->
        </div>
    </div>

    <!-- Map Area -->
    <div class="map-container">
        <div id="map"></div>

        <!-- Banner for selected event -->
        <div class="active-event-banner" id="activeBanner" style="display: none;">
            <h2 id="bannerTitle"><i class="fa-solid fa-route"></i> Selecciona un acte</h2>
            <p id="bannerDesc">Fes clic sobre quablessevol punt del mapa per anar afegint els punts del recorregut en ordre.</p>
        </div>

        <!-- Floating Action Toolbar -->
        <div class="map-toolbar" id="mapToolbar" style="display: none;">
            <button class="tool-btn btn-clear" onclick="clearCurrentRoute()"><i class="fa-solid fa-trash-can"></i> Esborrar Punts</button>
            <button class="tool-btn" onclick="undoLastPoint()"><i class="fa-solid fa-rotate-left"></i> Desfer darrer</button>
            <button class="tool-btn btn-save" onclick="saveCurrentRoute()"><i class="fa-solid fa-floppy-disk"></i> Guardar Itinerari</button>
        </div>

        <!-- Waypoints Chip Drawer -->
        <div class="waypoints-drawer" id="waypointsDrawer" style="display: none;">
            <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);"><i class="fa-solid fa-list-ol"></i> Punts:</span>
            <div id="waypointsChips" style="display: flex; gap: 8px;"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">✅ Itinerari guardat amb èxit!</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data/program.js"></script>

    <script>
        let map;
        let events = window.PROGRAM_DATA || [];
        let currentEvent = null;
        let currentWaypoints = []; // Array of { lat, lng, name }
        let currentPolyline = null;
        let currentMarkers = [];
        let activeFilter = 'all';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderEventsList();
            updateStats();
        });

        function initMap() {
            // Tarragona Center
            map = L.map('map', {
                zoomControl: false
            }).setView([41.1175, 1.2555], 15);

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Dark CartoDB Tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Map Click Event to Add Waypoints
            map.on('click', (e) => {
                if (!currentEvent) {
                    alert("Si us plau, selecciona primer un acte de la llista esquerra per editar la seva ruta.");
                    return;
                }
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                addWaypoint(lat, lng);
            });
        }

        function updateStats() {
            const totalWithRoute = events.filter(e => e.route_info && e.route_info.description).length;
            const configuredCount = events.filter(e => e.route_info && e.route_info.is_configured && e.route_info.is_manual).length;
            document.getElementById('statsBadge').innerText = `${configuredCount} / ${totalWithRoute} configurats manualment`;
        }

        function setFilter(filter, btn) {
            activeFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderEventsList();
        }

        function renderEventsList() {
            const listEl = document.getElementById('eventsList');
            const search = document.getElementById('searchInput').value.toLowerCase();

            listEl.innerHTML = '';

            const filtered = events.filter(e => {
                if (!e.route_info || !e.route_info.description) return false;
                const matchesSearch = e.title.toLowerCase().includes(search) || 
                                      e.route_info.description.toLowerCase().includes(search) ||
                                      (e.date && e.date.toLowerCase().includes(search));
                
                const isConfigured = !!(e.route_info.is_configured && e.route_info.is_manual);
                if (activeFilter === 'configured' && !isConfigured) return false;
                if (activeFilter === 'pending' && isConfigured) return false;

                return matchesSearch;
            });

            filtered.forEach(ev => {
                const card = document.createElement('div');
                const isConfigured = !!(ev.route_info.is_configured && ev.route_info.is_manual);
                const isSelected = currentEvent && currentEvent.id === ev.id;

                card.className = `event-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => selectEvent(ev);

                card.innerHTML = `
                    <div class="event-card-header">
                        <div class="event-title">${ev.title}</div>
                        <div class="status-check ${isConfigured ? 'configured' : 'pending'}" title="${isConfigured ? 'Itinerari configurat' : 'Pendent de configurar'}">
                            ${isConfigured ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-clock"></i>'}
                        </div>
                    </div>
                    <div class="event-meta">
                        <span>📅 ${ev.date || 'Santa Tecla'}</span>
                        <span>🕒 ${ev.time || ''}</span>
                    </div>
                    <div class="event-desc">${ev.route_info.description}</div>
                `;

                listEl.appendChild(card);
            });
        }

        function selectEvent(ev) {
            currentEvent = ev;
            renderEventsList(); // Update selected card UI

            document.getElementById('activeBanner').style.display = 'block';
            document.getElementById('mapToolbar').style.display = 'flex';
            document.getElementById('waypointsDrawer').style.display = 'flex';

            document.getElementById('bannerTitle').innerHTML = `<i class="fa-solid fa-route"></i> ${ev.title}`;
            document.getElementById('bannerDesc').innerText = ev.route_info.description;

            // Load existing waypoints if any
            currentWaypoints = [];
            if (ev.route_info && ev.route_info.waypoints && ev.route_info.waypoints.length > 0) {
                ev.route_info.waypoints.forEach(wp => {
                    if (wp.lat && wp.lng) {
                        currentWaypoints.push({ lat: wp.lat, lng: wp.lng, name: wp.name || `Punt ${currentWaypoints.length + 1}` });
                    }
                });
            } else if (ev.route_info && ev.route_info.coordinates && ev.route_info.coordinates.length > 0) {
                // Fallback to coordinates
                ev.route_info.coordinates.forEach((c, idx) => {
                    if (idx % 10 === 0 || idx === ev.route_info.coordinates.length - 1) {
                        currentWaypoints.push({ lat: c[0], lng: c[1], name: `Punt ${currentWaypoints.length + 1}` });
                    }
                });
            }

            redrawMapRoute();

            if (currentWaypoints.length > 0) {
                map.fitBounds(L.polyline(currentWaypoints.map(w => [w.lat, w.lng])).getBounds().pad(0.2));
            }
        }

        function addWaypoint(lat, lng) {
            currentWaypoints.push({
                lat: lat,
                lng: lng,
                name: `Punt ${currentWaypoints.length + 1}`
            });
            redrawMapRoute();
        }

        function undoLastPoint() {
            if (currentWaypoints.length > 0) {
                currentWaypoints.pop();
                redrawMapRoute();
            }
        }

        function clearCurrentRoute() {
            if (confirm("Segur que vols esborrar tots els punts marcats per a aquest acte?")) {
                currentWaypoints = [];
                redrawMapRoute();
            }
        }

        function removeWaypointAt(idx) {
            currentWaypoints.splice(idx, 1);
            redrawMapRoute();
        }

        function redrawMapRoute() {
            // Clear existing markers and polyline
            currentMarkers.forEach(m => map.removeLayer(m));
            currentMarkers = [];
            if (currentPolyline) map.removeLayer(currentPolyline);

            if (currentWaypoints.length === 0) {
                renderWaypointsChips();
                return;
            }

            // Draw Polyline
            const latLngs = currentWaypoints.map(w => [w.lat, w.lng]);
            currentPolyline = L.polyline(latLngs, {
                color: '#f59e0b',
                weight: 5,
                opacity: 0.9,
                dashArray: '8, 8'
            }).addTo(map);

            // Draw Markers
            currentWaypoints.forEach((wp, idx) => {
                const markerIcon = L.divIcon({
                    className: 'custom-waypoint-marker',
                    html: `${idx + 1}`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([wp.lat, wp.lng], {
                    icon: markerIcon,
                    draggable: true
                }).addTo(map);

                marker.on('dragend', (e) => {
                    const newPos = e.target.getLatLng();
                    currentWaypoints[idx].lat = newPos.lat;
                    currentWaypoints[idx].lng = newPos.lng;
                    redrawMapRoute();
                });

                currentMarkers.push(marker);
            });

            renderWaypointsChips();
        }

        function renderWaypointsChips() {
            const container = document.getElementById('waypointsChips');
            container.innerHTML = '';
            currentWaypoints.forEach((wp, idx) => {
                const chip = document.createElement('div');
                chip.className = 'waypoint-chip';
                chip.innerHTML = `
                    <span class="num">${idx + 1}</span>
                    <span>${wp.lat.toFixed(5)}, ${wp.lng.toFixed(5)}</span>
                    <i class="fa-solid fa-circle-xmark btn-del-wp" onclick="removeWaypointAt(${idx})"></i>
                `;
                container.appendChild(chip);
            });
        }

        async function saveCurrentRoute() {
            if (!currentEvent) return;
            if (currentWaypoints.length < 2) {
                alert("Cal marcar almenys 2 punts sobre el mapa per formar una ruta.");
                return;
            }

            // Interpolate dense coordinates between waypoints for smooth polyline
            const coordinates = [];
            for (let i = 0; i < currentWaypoints.length - 1; i++) {
                const p1 = currentWaypoints[i];
                const p2 = currentWaypoints[i+1];
                const dist = Math.hypot(p1.lat - p2.lat, p1.lng - p2.lng);
                const steps = Math.max(5, Math.floor(dist / 0.0001));

                for (let s = 0; s <= steps; s++) {
                    if (i > 0 && s === 0) continue;
                    coordinates.push([
                        p1.lat + (p2.lat - p1.lat) * (s / steps),
                        p1.lng + (p2.lng - p1.lng) * (s / steps)
                    ]);
                }
            }

            const payload = {
                id: currentEvent.id,
                waypoints: currentWaypoints,
                coordinates: coordinates,
                is_configured: true,
                is_manual: true
            };

            const endpoint = (window.location.protocol.startsWith('http')) 
                ? '/api/save-route' 
                : 'http://localhost:8080/api/save-route';

            try {
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const res = await resp.json();
                if (res.success) {
                    currentEvent.route_info.waypoints = currentWaypoints;
                    currentEvent.route_info.coordinates = coordinates;
                    currentEvent.route_info.is_configured = true;
                    currentEvent.route_info.is_manual = true;
                    currentEvent.route_info.has_route = true;

                    updateStats();
                    renderEventsList();
                    showToast("✅ Itinerari guardat i marcat com a configurat!");
                } else {
                    alert("Error en guardar la ruta: " + (res.message || "Error desconegut"));
                }
            } catch (err) {
                console.error(err);
                alert("Error de connexió en guardar la ruta.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
